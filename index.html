.finance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}.metric{padding:18px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:28px;margin-top:5px;color:#242642}.data-table{width:100%;border-collapse:collapse}.data-table th,.data-table td{padding:12px 10px;text-align:left;border-bottom:1px solid #ecebf1}.data-table th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

.mobile-menu{display:none}
@media(max-width:1000px){.app{grid-template-columns:84px 1fr}.brand-name,.brand small,.nav span,.sidebar-art{display:none}.brand{padding:0 7px 20px}.nav{justify-content:center;padding:12px}.hero{grid-template-columns:1fr}.hero-art{height:190px}.hand-note{right:10px}.home-grid,.therapy-grid,.detail-grid{grid-template-columns:1fr}.patient-grid{grid-template-columns:repeat(2,1fr)}.finance-grid{grid-template-columns:1fr 1fr}.detail-hero{grid-template-columns:auto 1fr}.detail-actions{grid-column:1/-1;display:flex;min-width:0}.detail-actions .btn{flex:1}}

</style>

<div class="app">

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY={patients:'linviaPatients',appointments:'linviaAppointments',sessions:'linviaSessions',goals:'linviaGoals',tasks:'linviaTasks',forms:'linviaForms',finance:'linviaFinance',settings:'linviaSettings'};
const iso=d=>d.toISOString().slice(0,10), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const uid=()=>crypto?.randomUUID?.()||String(Date.now()+Math.random());
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const parse=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const brDate=v=>{if(!v)return'—';const d=new Date(v+'T12:00:00');return d.toLocaleDateString('pt-BR')};
const dateLong=d=>d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).replace('.', '');
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function seed(){
  if(!parse(KEY.settings))save(KEY.settings,{name:'Camila Souza',role:'Terapeuta',clinic:'LINVIA'});
  if(!parse(KEY.patients))save(KEY.patients,[
    {id:uid(),name:'Helena Costa',birth:'1994-06-18',guardian:'Própria paciente',contact:'',email:'',notes:'Acompanhamento individual.',status:'Em acompanhamento'},
    {id:uid(),name:'Rafael Mendes',birth:'1987-11-03',guardian:'Próprio paciente',contact:'',email:'',notes:'Orientação e apoio terapêutico.',status:'Em acompanhamento'},
    {id:uid(),name:'Marina Ribeiro',birth:'1958-02-22',guardian:'Própria paciente',contact:'',email:'',notes:'Acompanhamento focado em autonomia e bem-estar.',status:'Em acompanhamento'},

function sessionModal(pid=''){const ps=data.patients();openModal('Registro de atendimento',`<div class="form-grid"><div class="field full"><label>Paciente</label><select id="sPatient">${ps.map(p=>`<option value="${p.id}" ${pid===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="sDate" type="date" value="${today()}"></div><div class="field"><label>Tipo</label><input id="sType" value="Atendimento terapêutico"></div><div class="field full"><label>Objetivo da sessão</label><textarea id="sObjectives"></textarea></div><div class="field full"><label>Evolução / observações</label><textarea id="sNotes"></textarea></div><div class="field full"><label>Próximos passos</label><textarea id="sPlan"></textarea></div></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveSession()">Salvar registro</button></div>`)}
function saveSession(){const p=patient($('#sPatient').value),x={id:uid(),patientId:p.id,patient:p.name,date:$('#sDate').value,type:$('#sType').value.trim(),objectives:$('#sObjectives').value.trim(),notes:$('#sNotes').value.trim(),plan:$('#sPlan').value.trim(),createdAt:new Date().toISOString()};save(KEY.sessions,[...data.sessions(),x]);closeModal();page('sessions');toast('Atendimento registrado.')}
function deleteSession(id){if(!confirm('Excluir este registro?'))return;save(KEY.sessions,data.sessions().filter(s=>s.id!==id));renderSessions()}
let therapyTab='plan';
const activities=[['Expressão emocional','Estratégias para reconhecer, nomear e comunicar emoções.','♡'],['Organização de rotina','Atividades para planejamento, previsibilidade e autonomia.','▦'],['Exercício de comunicação','Práticas para expressão, escuta e habilidades relacionais.','◌'],['Estratégia de autorregulação','Recursos para pausas, percepção corporal e manejo de estados internos.','◉']];
function renderTherapy(){const tabs=`<div class="tabs"><button class="tab ${therapyTab==='plan'?'active':''}" onclick="therapyTab='plan';renderTherapy()">Plano terapêutico</button><button class="tab ${therapyTab==='activities'?'active':''}" onclick="therapyTab='activities';renderTherapy()">Atividades</button><button class="tab ${therapyTab==='forms'?'active':''}" onclick="therapyTab='forms';renderTherapy()">Formulários e protocolos</button></div>`;$('#therapy').innerHTML=`<div class="hero" style="min-height:205px"><div class="hero-copy"><div class="eyebrow">Planejamento clínico</div><h1 style="font-size:42px">Terapia</h1><p>Planeje objetivos, organize atividades e acompanhe estratégias terapêuticas com flexibilidade.</p></div><div class="hero-art" style="height:205px">${heroSvg()}${handNote('Planejamento que se adapta<br>a cada história. ♡')}</div></div>${tabs}<div id="therapyBody">${therapyContent()}</div>`}
function therapyContent(){if(therapyTab==='activities')return `<div class="card card-pad"><div class="card-head"><div><h2>Biblioteca de atividades</h2><div class="tiny">Recursos neutros que você pode adaptar à sua abordagem.</div></div><button class="btn primary" onclick="activityModal()">+ Nova atividade</button></div><div class="activity-grid">${activities.map(a=>`<div class="activity-tile"><div class="activity-mark">${a[2]}</div><strong>${a[0]}</strong><span>${a[1]}</span></div>`).join('')}</div></div>`;if(therapyTab==='forms')return `<div class="card card-pad"><div class="card-head"><div><h2>Formulários e protocolos</h2><div class="tiny">Estruturas personalizadas criadas pelo próprio profissional.</div></div><button class="btn primary" onclick="formModal()">+ Novo formulário</button></div>${data.forms().map(f=>`<div class="protocol-row"><div><strong>${esc(f.name)}</strong><span>${f.sections} seções · Atualizado em ${brDate(f.updated)}</span></div><button class="btn ghost small" onclick="deleteForm('${f.id}')">Excluir</button></div>`).join('')}</div>`;const goals=data.goals();return `<div class="therapy-grid"><article class="card card-pad"><div class="card-head"><div><h2>Plano terapêutico</h2><div class="tiny">Objetivos atuais dos pacientes</div></div><button class="btn primary small" onclick="goalModal()">+ Novo objetivo</button></div><div class="progress-list">${goals.length?goals.map(goalRow).join(''):'<div class="empty">Nenhum objetivo cadastrado.</div>'}</div></article><div class="stack"><article class="card card-pad"><div class="card-head"><div><h2>Atividades</h2><div class="tiny">Biblioteca terapêutica</div></div><button class="link-btn" onclick="therapyTab='activities';renderTherapy()">Ver todas →</button></div><div class="activity-grid">${activities.slice(0,4).map(a=>`<div class="activity-tile"><div class="activity-mark">${a[2]}</div><strong>${a[0]}</strong><span>${a[1]}</span></div>`).join('')}</div></article><article class="card card-pad"><div class="card-head"><div><h2>Formulários e protocolos</h2><div class="tiny">Seus materiais personalizados</div></div><button class="link-btn" onclick="therapyTab='forms';renderTherapy()">Ver todos →</button></div>${data.forms().slice(0,3).map(f=>`<div class="protocol-row"><div><strong>${esc(f.name)}</strong><span>${f.sections} seções</span></div><span>›</span></div>`).join('')}</article></div></div>`}
function goalModal(){const ps=data.patients();openModal('Novo objetivo terapêutico',`<div class="form-grid"><div class="field full"><label>Paciente</label><select id="gPatient">${ps.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field full"><label>Objetivo</label><input id="gTitle" placeholder="Ex.: ampliar estratégias de autorregulação"></div><div class="field"><label>Progresso inicial (%)</label><input id="gProgress" type="number" min="0" max="100" value="0"></div><div class="field"><label>Cor de apoio</label><select id="gTone"><option value="purple">Lavanda</option><option value="sage">Sálvia</option></select></div></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveGoal()">Adicionar</button></div>`)}
function saveGoal(){const x={id:uid(),patientId:$('#gPatient').value,title:$('#gTitle').value.trim(),progress:Number($('#gProgress').value)||0,tone:$('#gTone').value};if(!x.title)return alert('Informe o objetivo.');save(KEY.goals,[...data.goals(),x]);closeModal();renderTherapy();toast('Objetivo adicionado.')}
function activityModal(){openModal('Nova atividade',`<p class="muted">A biblioteca da LINVIA é neutra: cadastre atividades próprias, sem vínculo com um método específico.</p><div class="form-grid"><div class="field full"><label>Nome</label><input id="aName"></div><div class="field full"><label>Descrição / como aplicar</label><textarea id="aDesc"></textarea></div></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Fechar</button><button class="btn primary" onclick="toast('Estrutura pronta para receber sua biblioteca autoral.');closeModal()">Salvar</button></div>`)}
function formModal(){openModal('Novo formulário',`<div class="form-grid"><div class="field full"><label>Nome do formulário</label><input id="fName"></div><div class="field"><label>Número de seções</label><input id="fSections" type="number" min="1" value="3"></div></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveForm()">Criar</button></div>`)}
function saveForm(){const name=$('#fName').value.trim();if(!name)return alert('Informe um nome.');save(KEY.forms,[...data.forms(),{id:uid(),name,sections:Number($('#fSections').value)||1,updated:today()}]);closeModal();therapyTab='forms';renderTherapy();toast('Formulário criado.')}
function deleteForm(id){save(KEY.forms,data.forms().filter(f=>f.id!==id));renderTherapy()}
function taskModal(pid=''){openModal('Nova pendência',`<div class="form-grid"><div class="field full"><label>Tarefa</label><input id="tTitle"></div><div class="field full"><label>Paciente</label><select id="tPatient"><option value="">Geral</option>${data.patients().map(p=>`<option value="${p.id}" ${pid===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveTask()">Adicionar</button></div>`)}
function saveTask(){const title=$('#tTitle').value.trim();if(!title)return;save(KEY.tasks,[...data.tasks(),{id:uid(),patientId:$('#tPatient').value||null,title,done:false}]);closeModal();toast('Pendência adicionada.')}
function renderAssessments(){const ps=data.patients();$('#assessments').innerHTML=`<div class="page-head"><div><div class="eyebrow">Acompanhamento</div><h1>Avaliações</h1><p>Registre avaliações próprias e acompanhe mudanças ao longo do tempo.</p></div><button class="btn primary" onclick="evaluationModal()">+ Nova avaliação</button></div><div class="card card-pad"><div class="card-head"><div><h2>Avaliações recentes</h2><div class="tiny">Sem protocolos proprietários: use critérios e instrumentos que façam sentido para sua prática.</div></div></div><div class="empty">Nenhuma avaliação nova registrada nesta versão. Use “Nova avaliação” para criar um registro livre.</div></div>`}
function evaluationModal(){openModal('Nova avaliação',`<div class="form-grid"><div class="field full"><label>Paciente</label><select id="ePatient">${data.patients().map(p=>`<option>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Data</label><input type="date" value="${today()}"></div><div class="field"><label>Tipo</label><input value="Avaliação de progresso"></div><div class="field full"><label>Registro</label><textarea placeholder="Descreva os critérios utilizados, achados e interpretação clínica..."></textarea></div></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="toast('Avaliação salva como rascunho nesta etapa.');closeModal()">Salvar</button></div>`)}
function renderFinance(){const rows=data.finance(),received=rows.filter(x=>x.status==='Recebido').reduce((a,b)=>a+Number(b.value||0),0),pending=rows.filter(x=>x.status!=='Recebido').reduce((a,b)=>a+Number(b.value||0),0);$('#finance').innerHTML=`<div class="page-head"><div><div class="eyebrow">Gestão do consultório</div><h1>Financeiro</h1><p>Controle simples de recebimentos e pendências.</p></div><button class="btn primary" onclick="financeModal()">+ Lançamento</button></div><div class="finance-grid"><article class="card metric"><span>Recebido</span><strong>${money(received)}</strong></article><article class="card metric"><span>Pendente</span><strong>${money(pending)}</strong></article><article class="card metric"><span>Lançamentos</span><strong>${rows.length}</strong></article></div><article class="card card-pad"><table class="data-table"><thead><tr><th>Data</th><th>Paciente</th><th>Descrição</th><th>Valor</th><th>Status</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${brDate(r.date)}</td><td>${esc(patient(r.patientId)?.name||'—')}</td><td>${esc(r.description)}</td><td>${money(r.value)}</td><td>${esc(r.status)}</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">Nenhum lançamento financeiro.</div></td></tr>`}</tbody></table></article>`}
function financeModal(){openModal('Novo lançamento',`<div class="form-grid"><div class="field full"><label>Paciente</label><select id="fiPatient">${data.patients().map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="fiDate" type="date" value="${today()}"></div><div class="field"><label>Valor</label><input id="fiValue" type="number" step="0.01"></div><div class="field"><label>Status</label><select id="fiStatus"><option>Recebido</option><option>Pendente</option></select></div><div class="field"><label>Descrição</label><input id="fiDesc" value="Sessão terapêutica"></div></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveFinance()">Salvar</button></div>`)}
function saveFinance(){save(KEY.finance,[...data.finance(),{id:uid(),patientId:$('#fiPatient').value,date:$('#fiDate').value,value:Number($('#fiValue').value)||0,status:$('#fiStatus').value,description:$('#fiDesc').value.trim()}]);closeModal();renderFinance();toast('Lançamento salvo.')}
function renderReports(){const ps=data.patients();$('#reports').innerHTML=`<div class="page-head"><div><div class="eyebrow">Sínteses</div><h1>Relatórios</h1><p>Monte uma síntese a partir dos registros já existentes.</p></div></div><div class="detail-grid"><article class="card card-pad"><div class="field"><label>Paciente</label><select id="reportPatient" onchange="buildReport()">${ps.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Período inicial</label><input id="reportStart" type="date" onchange="buildReport()"></div><div class="field" style="margin-top:12px"><label>Período final</label><input id="reportEnd" type="date" value="${today()}" onchange="buildReport()"></div><div class="quick-actions" style="margin-top:16px"><button class="btn primary" onclick="buildReport()">Gerar síntese</button><button class="btn ghost" onclick="window.print()">Imprimir / PDF</button></div></article><article class="card card-pad"><div class="card-head"><h2>Prévia</h2></div><div class="report-preview" id="reportPreview">Selecione um paciente para gerar a síntese.</div></article></div>`;buildReport()}
function buildReport(){const id=$('#reportPatient')?.value;if(!id)return;const p=patient(id),start=$('#reportStart')?.value||'',end=$('#reportEnd')?.value||today(),ss=data.sessions().filter(s=>(s.patientId===id||s.patient===p.name)&&(!start||s.date>=start)&&(!end||s.date<=end)).sort((a,b)=>a.date.localeCompare(b.date)),gs=data.goals().filter(g=>g.patientId===id);let text=`RELATÓRIO DE ACOMPANHAMENTO\n\nPaciente: ${p.name}\nPeríodo: ${start?brDate(start):'início do acompanhamento'} a ${brDate(end)}\n\nOBJETIVOS EM ACOMPANHAMENTO\n${gs.length?gs.map(g=>`• ${g.title} — ${g.progress}%`).join('\n'):'• Nenhum objetivo cadastrado.'}\n\nREGISTROS DO PERÍODO\n${ss.length?ss.map(s=>`${brDate(s.date)} — ${s.type}\n${s.notes||s.objectives||'Sem observações registradas.'}`).join('\n\n'):'Nenhum registro de atendimento no período.'}\n\nPRÓXIMOS PASSOS\n${ss.filter(s=>s.plan).slice(-3).map(s=>s.plan).join('\n')||'Definir conforme continuidade do acompanhamento.'}`;$('#reportPreview').textContent=text}
function renderSettings(){const s=data.settings();$('#settings').innerHTML=`<div class="page-head"><div><div class="eyebrow">Preferências</div><h1>Configurações</h1><p>Personalize os dados exibidos na plataforma.</p></div></div><div class="settings-grid"><article class="card card-pad"><h2>Perfil profissional</h2><div class="field" style="margin-top:16px"><label>Nome</label><input id="setName" value="${esc(s.name||'')}"></div><div class="field" style="margin-top:12px"><label>Profissão / função</label><input id="setRole" value="${esc(s.role||'')}"></div><div class="field" style="margin-top:12px"><label>Nome do espaço ou clínica</label><input id="setClinic" value="${esc(s.clinic||'')}"></div><button class="btn primary" style="margin-top:16px" onclick="saveSettings()">Salvar alterações</button></article><article class="card card-pad"><h2>Sobre esta versão</h2><p class="muted">A LINVIA foi reorganizada como plataforma de gestão terapêutica independente de método, instrumento ou abordagem proprietária.</p><div class="card" style="padding:16px;background:var(--sage-soft);box-shadow:none"><strong>Identidade visual</strong><p class="tiny">Lavanda acinzentado, sálvia, off-white e ilustrações autorais desenhadas à mão.</p></div></article></div>`}
function saveSettings(){const s={name:$('#setName').value.trim(),role:$('#setRole').value.trim(),clinic:$('#setClinic').value.trim()};save(KEY.settings,s);syncTop();toast('Configurações salvas.')}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.remove('hidden');document.body.style.overflow='hidden'}function closeModal(){$('#modal').classList.add('hidden');document.body.style.overflow=''}
$('#modalClose').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
$$('.nav').forEach(b=>b.onclick=()=>page(b.dataset.page));$$('[data-page-open]').forEach(b=>b.onclick=()=>page(b.dataset.pageOpen));$('#mobileMenu').onclick=()=>$('#nav').classList.toggle('open');
$('#globalSearch').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const q=e.target.value.trim().toLowerCase();if(!q)return;const p=data.patients().find(p=>p.name.toLowerCase().includes(q));if(p)openPatient(p.id);else{page('patients');setTimeout(()=>{$('#patientSearch').value=q;filterPatients()},0)}});
function syncTop(){const s=data.settings();$('#topName').textContent=s.name||'Terapeuta';$('#topRole').textContent=s.role||'Profissional';$('#topAvatar').textContent=initials(s.name||'T')}
$('#todayLabel').textContent=dateLong(new Date());syncTop();renderHome();
</script>
</body>
</html>
